<h2>Creator Dashboard</h2>
<p>Welcome to your studio. Add products, generate captions, and ship with peace.</p>
<form id="add">
  <div class="card">
    <input name="slug" placeholder="slug (unique)" required>
    <input name="title" placeholder="title" required>
    <input name="description" placeholder="description">
    <input name="price_cents" type="number" placeholder="price in cents" required>
    <select name="status"><option>draft</option><option selected>published</option></select>
    <button class="btn">Add/Update</button>
  </div>
</form>
<script>
document.getElementById('add').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const fd=new FormData(e.target);
  const body=Object.fromEntries(fd.entries());
  body.price_cents=Number(body.price_cents||0);
  const r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok) alert('Saved!'); else alert('Error saving');
});
</script>
