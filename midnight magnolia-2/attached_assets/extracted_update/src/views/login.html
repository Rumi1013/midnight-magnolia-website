<h2>Login</h2>
<form method="post" action="/login" class="card">
  <label>Email</label>
  <input type="email" name="email" placeholder="you@example.com" required>
  <button class="btn" type="submit">Send Magic Link</button>
</form>

<p class="card" style="margin-top:1rem;">
  After opening your magic link, paste the token payload here (MVP step) to set your session cookie:
</p>
<form method="post" action="/auth/callback" class="card">
  <textarea name='access_token' placeholder='access_token' required></textarea>
  <textarea name='refresh_token' placeholder='refresh_token'></textarea>
  <textarea name='user' placeholder='{"email":"you@example.com"}'></textarea>
  <button class="btn" type="submit">Set Session</button>
</form>
