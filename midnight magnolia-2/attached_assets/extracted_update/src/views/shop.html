<h2>Shop</h2>
<div id="list"></div>
<script>
fetch('/api/products').then(r=>r.json()).then(rows=>{
  const el=document.getElementById('list');
  rows.forEach(p=>{
    const div=document.createElement('div');
    div.className='card product';
    div.innerHTML=`
      <h3>${p.title}</h3>
      <p>${p.description||''}</p>
      <strong>$${(p.price_cents/100).toFixed(2)}</strong>
      <button data-slug="${p.slug}">Buy Now</button>
    `;
    el.appendChild(div);
  });
  el.addEventListener('click', async (e)=>{
    if(e.target.tagName==='BUTTON'){
      const slug=e.target.getAttribute('data-slug');
      const r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug})});
      const {url}=await r.json(); location.href=url;
    }
  });
});
</script>
