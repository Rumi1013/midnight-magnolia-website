<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Magnolia Flower - Southern Gothic Style -->
  <g id="magnolia-flower">
    <!-- Center circle -->
    <circle cx="60" cy="60" r="8" fill="#D4AF37"/>
    
    <!-- Large petals -->
    <ellipse cx="60" cy="35" rx="12" ry="20" fill="#FAF3E0" stroke="#D4AF37" stroke-width="1.5"/>
    <ellipse cx="60" cy="85" rx="12" ry="20" fill="#FAF3E0" stroke="#D4AF37" stroke-width="1.5"/>
    <ellipse cx="35" cy="60" rx="20" ry="12" fill="#FAF3E0" stroke="#D4AF37" stroke-width="1.5"/>
    <ellipse cx="85" cy="60" rx="20" ry="12" fill="#FAF3E0" stroke="#D4AF37" stroke-width="1.5"/>
    
    <!-- Diagonal petals -->
    <ellipse cx="42" cy="42" rx="14" ry="18" fill="#FAF3E0" stroke="#D4AF37" stroke-width="1.5" transform="rotate(-45 42 42)"/>
    <ellipse cx="78" cy="42" rx="14" ry="18" fill="#FAF3E0" stroke="#D4AF37" stroke-width="1.5" transform="rotate(45 78 42)"/>
    <ellipse cx="42" cy="78" rx="14" ry="18" fill="#FAF3E0" stroke="#D4AF37" stroke-width="1.5" transform="rotate(45 42 78)"/>
    <ellipse cx="78" cy="78" rx="14" ry="18" fill="#FAF3E0" stroke="#D4AF37" stroke-width="1.5" transform="rotate(-45 78 78)"/>
    
    <!-- Outer decorative petals -->
    <path d="M60 20 L65 30 L60 28 L55 30 Z" fill="#A3B18A" opacity="0.7"/>
    <path d="M60 100 L65 90 L60 92 L55 90 Z" fill="#A3B18A" opacity="0.7"/>
    <path d="M20 60 L30 55 L28 60 L30 65 Z" fill="#A3B18A" opacity="0.7"/>
    <path d="M100 60 L90 55 L92 60 L90 65 Z" fill="#A3B18A" opacity="0.7"/>
    
    <!-- Center details -->
    <circle cx="60" cy="60" r="5" fill="#0A192F" opacity="0.2"/>
    <circle cx="57" cy="58" r="2" fill="#D4AF37"/>
    <circle cx="63" cy="58" r="2" fill="#D4AF37"/>
    <circle cx="60" cy="62" r="2" fill="#D4AF37"/>
  </g>
</svg>
