# Netlify Configuration for Midnight Magnolia
# This file tells Netlify exactly how to build your site

[build]
  # Build command to run
  command = "pnpm run build"
  
  # Directory with built files to publish
  publish = "out"
  
  # Base directory (where package.json is)
  base = "."

[build.environment]
  # Node version (20+ required for Next.js 15 and Supabase)
  NODE_VERSION = "20"
  
  # Enable pnpm
  NPM_FLAGS = "--legacy-peer-deps"
  
  # Allow non-secret environment variables in build output
  # Public keys and URLs are designed to be public and safe for client-side use
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY,NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN,NEXT_PUBLIC_SHOPIFY_DOMAIN,NODE_ENV,NEXT_PUBLIC_SITE_URL,SUPABASE_URL"
  
  # Skip secrets scanning in build artifacts and documentation
  # .next = temporary build directory (not deployed)
  # *.md = documentation files with example values
  # .cursorrules = cursor agent configuration with examples
  SECRETS_SCAN_OMIT_PATHS = ".next/**,*.md,.cursorrules"

# Redirect rules for clean URLs
[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat"
  status = 200

[[redirects]]
  from = "/shop/*"
  to = "/shop/:splat"
  status = 200

# 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers for static assets (cache for 1 year)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Form handling (if you add Netlify forms)
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

